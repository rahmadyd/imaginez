<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <style>
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }
      .mask-group { transform-origin: 50% 50%; animation: spin 8s linear infinite; }
      .eye { animation: pulse 2s ease-in-out infinite; }
      .eye.right { animation-delay: 0.5s; }
    </style>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#120D10"/>
      <stop offset="100%" stop-color="#0A0708"/>
    </radialGradient>
    <radialGradient id="maskGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#F4EFE6"/>
      <stop offset="100%" stop-color="#B8AFA6"/>
    </radialGradient>
    <radialGradient id="goldGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#C5A059"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="url(#bgGrad)"/>
  
  <!-- Subtle brass border -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Theater mask (comedy/tragedy combined) -->
  <g class="mask-group" filter="url(#glow)">
    <!-- Main mask face -->
    <ellipse cx="50" cy="50" rx="32" ry="36" fill="url(#maskGrad)" stroke="#120D10" stroke-width="1.5"/>
    
    <!-- Left eye (comedy - curved up) -->
    <g class="eye left">
      <path d="M30 42 Q30 36 38 36 Q46 36 46 42 Q46 46 38 46 Q30 46 30 42" fill="#120D10"/>
      <ellipse cx="34" cy="40" rx="3" ry="4" fill="#D4AF37" opacity="0.8"/>
    </g>
    
    <!-- Right eye (tragedy - curved down) -->
    <g class="eye right">
      <path d="M54 42 Q54 48 62 48 Q70 48 70 42 Q70 38 62 38 Q54 38 54 42" fill="#120D10"/>
      <ellipse cx="66" cy="44" rx="3" ry="4" fill="#D4AF37" opacity="0.8"/>
    </g>
    
    <!-- Nose -->
    <path d="M50 48 L47 56 L53 56 Z" fill="#120D10" opacity="0.7"/>
    
    <!-- Mouth (subtle smile/frown blend) -->
    <path d="M35 60 Q50 66 65 60" fill="none" stroke="#120D10" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Gold accent dots (cabaret lights) -->
    <circle cx="22" cy="30" r="2" fill="url(#goldGrad)" opacity="0.9"/>
    <circle cx="78" cy="30" r="2" fill="url(#goldGrad)" opacity="0.9"/>
    <circle cx="18" cy="55" r="1.5" fill="url(#goldGrad)" opacity="0.7"/>
    <circle cx="82" cy="55" r="1.5" fill="url(#goldGrad)" opacity="0.7"/>
    <circle cx="50" cy="18" r="2" fill="url(#goldGrad)" opacity="0.9"/>
    <circle cx="50" cy="78" r="1.5" fill="url(#goldGrad)" opacity="0.7"/>
  </g>
  
  <!-- Center brass rivet -->
  <circle cx="50" cy="50" r="3" fill="url(#goldGrad)"/>
</svg>