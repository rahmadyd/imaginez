<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#120D10"/>
      <stop offset="100%" stop-color="#0A0708"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#C5A059"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <circle cx="50" cy="50" r="50" fill="url(#bg)"/>
  
  <!-- Pinwheel (biang-lala) - 4 blades, static -->
  <g fill="url(#gold)">
    <path d="M50 20 L55 45 L45 45 Z"/>  <!-- Top -->
    <path d="M80 50 L55 45 L55 55 Z"/>  <!-- Right -->
    <path d="M50 80 L45 55 L55 55 Z"/>  <!-- Bottom -->
    <path d="M20 50 L45 45 L45 55 Z"/>  <!-- Left -->
  </g>
  
  <!-- Center hub -->
  <circle cx="50" cy="50" r="8" fill="url(#gold)"/>
  
  <!-- Inner dot -->
  <circle cx="50" cy="50" r="3" fill="#120D10"/>
</svg>