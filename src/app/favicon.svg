<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <style>
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .ring { transform-origin: 50% 50%; animation: spin 10s linear infinite; }
    </style>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#120D10"/>
      <stop offset="100%" stop-color="#0A0708"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#C5A059"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <circle cx="50" cy="50" r="50" fill="url(#bg)"/>
  
  <!-- Outer ring -->
  <circle class="ring" cx="50" cy="50" r="45" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.5"/>
  
  <!-- Z letter -->
  <text x="50" y="62" font-family="Georgia, serif" font-size="50" font-weight="bold" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle">Z</text>
  
  <!-- Inner accent dot -->
  <circle cx="50" cy="50" r="4" fill="url(#gold)"/>
</svg>