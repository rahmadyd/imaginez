name = "imaginez"
main = ".open-next/worker.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "imaginez-templates"
database_id = ""

[[r2_buckets]]
binding = "TEMPLATES_BUCKET"
bucket_name = "imaginez-templates"