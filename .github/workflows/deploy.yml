name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build for Cloudflare
        run: pnpm opennextjs-cloudflare build
        env:
          USE_LOCAL_FALLBACK: "false"

      # Deploy ke Cloudflare Workers dilakukan oleh integrasi Cloudflare Workers Builds
      # (repo ini ter-link di Cloudflare Dashboard). Secrets & binding tetap di dashboard.
